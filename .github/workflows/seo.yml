name: SEO validation

on:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical production endpoints
        shell: bash
        run: |
          set -euo pipefail

          base='https://akontaxi.ch'
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          root_status="$(curl --fail-with-body --silent --show-error --location --output "$tmp_dir/root.html" --write-out '%{http_code}' "$base/")"
          test "$root_status" = '200'

          googlebot_status="$(curl --fail-with-body --silent --show-error --location --user-agent 'Googlebot' --output "$tmp_dir/googlebot.html" --write-out '%{http_code}' "$base/")"
          test "$googlebot_status" = '200'
          cmp "$tmp_dir/root.html" "$tmp_dir/googlebot.html"

          robots_status="$(curl --fail-with-body --silent --show-error --location --output "$tmp_dir/robots.txt" --write-out '%{http_code}' "$base/robots.txt")"
          test "$robots_status" = '200'
          grep -Fq 'Sitemap: https://akontaxi.ch/sitemap.xml' "$tmp_dir/robots.txt"

          sitemap_status="$(curl --fail-with-body --silent --show-error --location --output "$tmp_dir/sitemap.xml" --write-out '%{http_code}' "$base/sitemap.xml")"
          test "$sitemap_status" = '200'
          grep -Fq '<loc>https://akontaxi.ch</loc>' "$tmp_dir/sitemap.xml"

          missing_status="$(curl --silent --show-error --output "$tmp_dir/missing.html" --write-out '%{http_code}' "$base/__seo-missing__")"
          test "$missing_status" = '404'

          redirect_headers="$(curl --silent --show-error --head --max-redirs 0 http://akontaxi.ch/)"
          printf '%s\n' "$redirect_headers" | grep -Eq '^HTTP/[0-9.]+ 30[178]([[:space:]]|$)'
          printf '%s\n' "$redirect_headers" | grep -Eiq '^location: https://akontaxi\.ch/?([[:space:]]|$)'

  lighthouse-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record browser version
        run: google-chrome --version

      - name: Run mobile Lighthouse
        run: |
          mkdir -p lighthouse-reports
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse https://akontaxi.ch \
            --only-categories=performance,seo \
            --output=json \
            --output-path=lighthouse-reports/mobile.json \
            --chrome-flags='--headless --no-sandbox' \
            --quiet

      - name: Run desktop Lighthouse
        run: |
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse https://akontaxi.ch \
            --preset=desktop \
            --only-categories=performance,seo \
            --output=json \
            --output-path=lighthouse-reports/desktop.json \
            --chrome-flags='--headless --no-sandbox' \
            --quiet

      - name: Summarize baseline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const report = (name) => {
            const data = JSON.parse(readFileSync(`lighthouse-reports/${name}.json`, 'utf8'));
            const audit = (id) => data.audits[id]?.numericValue ?? null;
            return {
              performance: Math.round((data.categories.performance?.score ?? 0) * 100),
              seo: Math.round((data.categories.seo?.score ?? 0) * 100),
              lcpMs: Math.round(audit('largest-contentful-paint') ?? 0),
              cls: Number((audit('cumulative-layout-shift') ?? 0).toFixed(3)),
              tbtMs: Math.round(audit('total-blocking-time') ?? 0),
              fcpMs: Math.round(audit('first-contentful-paint') ?? 0),
            };
          };

          const baseline = {
            measuredAt: new Date().toISOString(),
            lighthouseVersion: '13.5.0',
            url: 'https://akontaxi.ch',
            mobile: report('mobile'),
            desktop: report('desktop'),
          };

          writeFileSync('lighthouse-reports/baseline.json', `${JSON.stringify(baseline, null, 2)}\n`);

          const row = (name, value) =>
            `| ${name} | ${value.performance} | ${value.seo} | ${value.lcpMs} ms | ${value.cls} | ${value.tbtMs} ms | ${value.fcpMs} ms |`;

          const summary = [
            '## AKON TAXI Lighthouse baseline',
            '',
            '| Profile | Performance | SEO | LCP | CLS | TBT | FCP |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            row('Mobile', baseline.mobile),
            row('Desktop', baseline.desktop),
            '',
            'Lighthouse is a lab measurement. TBT is recorded as a lab diagnostic and is not INP.',
          ].join('\n');

          process.stdout.write(`${summary}\n`);
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`, { flag: 'a' });
          NODE

      - name: Upload Lighthouse baseline
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-baseline
          path: lighthouse-reports
          if-no-files-found: error

  lighthouse-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build production application
        run: bun run build

      - name: Start production application
        shell: bash
        run: |
          bun run start -- --hostname 127.0.0.1 --port 3000 > /tmp/akontaxi-next.log 2>&1 &
          echo "$!" > /tmp/akontaxi-next.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/akontaxi-next.log
          exit 1

      - name: Run mobile Lighthouse candidate
        run: |
          mkdir -p lighthouse-candidate
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse http://127.0.0.1:3000             --only-categories=performance,seo             --output=json             --output-path=lighthouse-candidate/mobile.json             --chrome-flags='--headless --no-sandbox'             --quiet

      - name: Run desktop Lighthouse candidate
        run: |
          npm exec --yes --package=lighthouse@13.5.0 -- lighthouse http://127.0.0.1:3000             --preset=desktop             --only-categories=performance,seo             --output=json             --output-path=lighthouse-candidate/desktop.json             --chrome-flags='--headless --no-sandbox'             --quiet

      - name: Summarize candidate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const report = (name) => {
            const data = JSON.parse(readFileSync(`lighthouse-candidate/${name}.json`, 'utf8'));
            const audit = (id) => data.audits[id]?.numericValue ?? null;
            return {
              performance: Math.round((data.categories.performance?.score ?? 0) * 100),
              seo: Math.round((data.categories.seo?.score ?? 0) * 100),
              lcpMs: Math.round(audit('largest-contentful-paint') ?? 0),
              cls: Number((audit('cumulative-layout-shift') ?? 0).toFixed(3)),
              tbtMs: Math.round(audit('total-blocking-time') ?? 0),
              fcpMs: Math.round(audit('first-contentful-paint') ?? 0),
            };
          };

          const candidate = {
            measuredAt: new Date().toISOString(),
            lighthouseVersion: '13.5.0',
            url: 'http://127.0.0.1:3000',
            mobile: report('mobile'),
            desktop: report('desktop'),
          };

          writeFileSync(
            'lighthouse-candidate/candidate.json',
            `${JSON.stringify(candidate, null, 2)}\n`,
          );

          const row = (name, value) =>
            `| ${name} | ${value.performance} | ${value.seo} | ${value.lcpMs} ms | ${value.cls} | ${value.tbtMs} ms | ${value.fcpMs} ms |`;

          const summary = [
            '## AKON TAXI Lighthouse PR candidate',
            '',
            '| Profile | Performance | SEO | LCP | CLS | TBT | FCP |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |',
            row('Mobile', candidate.mobile),
            row('Desktop', candidate.desktop),
            '',
            'Candidate measurements run against the production build from this exact PR head.',
          ].join('\n');

          process.stdout.write(`${summary}\n`);
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`, { flag: 'a' });
          NODE

      - name: Upload Lighthouse candidate
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-candidate
          path: lighthouse-candidate
          if-no-files-found: error

      - name: Stop production application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/akontaxi-next.pid ]; then
            kill "$(cat /tmp/akontaxi-next.pid)" || true
          fi
