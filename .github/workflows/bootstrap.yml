name: Bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Synchronize Ankhorage Devtools
        run: bunx @ankhorage/ankh@0.11.1 devtools sync .

      - name: Capture managed workflows
        run: |
          echo "CI_B64=$(base64 -w0 .github/workflows/ci.yml)"
          echo "RENOVATE_B64=$(base64 -w0 .github/workflows/renovate.yml)"

      - name: Configure Knip entrypoints
        run: |
          cat > knip.config.ts <<'EOF'
          import { createKnipConfig } from '@ankhorage/devtools/knip';

          export default createKnipConfig({
            entry: [
              '.prettierrc.js',
              'eslint.config.mjs',
              'eslint.local.config.mjs',
              'prettier.local.config.js',
            ],
          });
          EOF

      - name: Remove bootstrap workflow
        run: rm .github/workflows/bootstrap.yml

      - name: Validate bootstrap
        run: |
          bun run build
          bun run format
          bun run typecheck
          bun run lint
          bun run knip:check
          bun run format:check

      - name: Commit synchronized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync devtools"
          git push origin HEAD:main
