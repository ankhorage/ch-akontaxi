name: Format proposal

on:
  push:
    branches:
      - feat/initial-website

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format website proposal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/initial-website
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install

      - name: Format
        run: bun run format

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/format-proposal.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format website proposal"
          git push origin HEAD:feat/initial-website
