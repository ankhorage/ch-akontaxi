name: Rebuild photo assets

on:
  push:
    branches:
      - fix/photo-assets
    paths:
      - '.asset-staging/**'
      - '.github/workflows/rebuild-photo-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/photo-assets
          fetch-depth: 0

      - name: Rebuild assets
        run: |
          cat .asset-staging/hero-desktop.*.b64 | tr -d '\n' | base64 --decode > public/images/hero-desktop.avif
          cat .asset-staging/hero-mobile.*.b64 | tr -d '\n' | base64 --decode > public/images/hero-mobile.avif
          cat .asset-staging/vehicle.*.b64 | tr -d '\n' | base64 --decode > public/images/vehicle.avif

      - name: Validate assets
        run: |
          test "$(stat -c%s public/images/hero-desktop.avif)" -eq 12916
          test "$(stat -c%s public/images/hero-mobile.avif)" -eq 9049
          test "$(stat -c%s public/images/vehicle.avif)" -eq 11563
          test "$(file -b --mime-type public/images/hero-desktop.avif)" = "image/avif"
          test "$(file -b --mime-type public/images/hero-mobile.avif)" = "image/avif"
          test "$(file -b --mime-type public/images/vehicle.avif)" = "image/avif"

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-desktop.avif public/images/hero-mobile.avif public/images/vehicle.avif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore valid photo assets"
          git push origin HEAD:fix/photo-assets
